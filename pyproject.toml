[project]
name = "healthcare-staffing-pipeline"
version = "0.1.0"
description = "Healthcare nurse staffing analytics pipeline"
authors = [
    {name = "Fulati Paerhati"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy (>=1.26,<2.4)",
    "pandas (>=1.5,<3.0)",
    "ydata-profiling (>=4.18.1,<5.0.0)",
    "boto3 (>=1.42.66,<2.0.0)",
    "google-api-python-client (>=2.192.0,<3.0.0)",
    "google-auth (>=2.49.0,<3.0.0)",
    "google-auth-oauthlib (>=1.3.0,<2.0.0)",
    "snowflake-connector-python (>=4.3.0,<5.0.0)",
    "snowflake-sqlalchemy (>=1.9.0,<2.0.0)",
    "dbt-core (>=1.11.7,<2.0.0)",
    "dbt-snowflake (>=1.11.3,<2.0.0)",
    "streamlit (>=1.55.0,<2.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyspark (>=4.1.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=24.0,<26.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "sqlfluff (>=4.0.4,<5.0.0)"
]
